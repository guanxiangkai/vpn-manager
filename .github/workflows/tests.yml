name: 自动测试

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 获取源码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: 配置 Python 环境
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: 安装应用与测试依赖
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: 安装 Chromium 浏览器验收依赖
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: 检查依赖一致性
        run: python -m pip check
      - name: 运行接口与网关回归测试
        run: timeout 300 python -m pytest tests/test_api.py tests/test_session_observer.py tests/test_cross_origin_session.py tests/test_gateway_sync.py tests/test_gateway_agent.py tests/test_web_certificate.py tests/test_web_certificate_renew.py tests/test_tls_private_key.py tests/test_home_egress.py tests/test_home_firewall_order.py tests/test_home_egress_publish.py tests/test_home_egress_rollback.py -v -p no:cacheprovider
      - name: 运行原生 HTTPS Chromium 验收
        run: timeout 240 bash tests/run_browser_acceptance.sh
        env:
          VPN_MANAGER_BROWSER_EVIDENCE: .runtime/browser-evidence
      - name: 保存隔离测试页面截图
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: .runtime/browser-evidence/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: 运行跨站 Bearer HTTPS Chromium 验收
        run: timeout 240 bash tests/run_cross_origin_acceptance.sh
