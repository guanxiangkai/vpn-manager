name: IKEv2 split routing acceptance

on:
  push:
    branches: [codex/vpn-split-routing-check]

permissions:
  contents: read

jobs:
  rollback-watchdog:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Exercise timer firing and lock retry with real systemd
        run: |
          sudo /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          from unittest.mock import patch

          from ops import home_egress_publish as publish

          def systemctl(*args, check=True):
              return subprocess.run(
                  ["/bin/systemctl", *args], check=check, capture_output=True,
                  text=True, timeout=15,
              )

          def wait_for(predicate, message):
              deadline = time.monotonic() + 30
              while time.monotonic() < deadline:
                  if predicate():
                      return
                  time.sleep(0.2)
              raise RuntimeError(message)

          os.umask(0o077)
          with tempfile.TemporaryDirectory(prefix="vpn-watchdog-") as temporary:
              txn = Path(temporary)
              service, timer = publish._unit_names(txn)
              journal = txn / "journal.json"
              rollback_python = Path(sys.executable).resolve(strict=True)
              unchanged = txn / "gateway.json"
              unchanged.write_bytes(b'{"home_internet":{"enabled":true}}\n')
              baseline = publish._sha256(unchanged)
              record = dict.fromkeys(
                  ("baseline_module_hash", "candidate_module_hash", "config_hash",
                   "candidate_config_hash", "extra_hash"), baseline,
              )
              record.update({
                  "status": "prepared", "split_config": "staged", "known_pools": [],
                  "agent_service": "fixture-agent.service", "rollback_python": str(rollback_python),
                  "routing": {"table": 150, "priority": 18000, "protocol": 186},
              })
              for key in ("module_path", "extra_module_path", "accounts_path",
                          "state_lock_path", "control_socket_path"):
                  record[key] = str(txn / key)
              record["config_path"] = str(unchanged)
              journal.write_text(json.dumps(record))
              shutil.copyfile("ops/home_egress_rollback.py", txn / "home_egress_rollback.py")
              generated = publish._unit_contents

              def short_timer(transaction, python):
                  service_text, timer_text = generated(transaction, python)
                  if b"OnActiveSec=20min\n" not in timer_text:
                      raise RuntimeError("unexpected_production_timer_definition")
                  return service_text, timer_text.replace(
                      b"OnActiveSec=20min\n", b"OnActiveSec=3s\nAccuracySec=100ms\n",
                  )

              try:
                  with patch.object(publish, "_unit_contents", short_timer):
                      assert publish.arm(txn) == "armed"
                  lock = publish._lock(txn)
                  try:
                      wait_for(lambda: systemctl("show", service, "-p", "SubState", "--value")
                               .stdout.strip() == "auto-restart", "timer_did_not_retry_held_lock")
                      assert publish.status(txn) == "armed"
                  finally:
                      os.close(lock)
                  wait_for(lambda: publish.status(txn) == "rolled_back"
                           and systemctl("is-active", "--quiet", timer, check=False).returncode == 3,
                           "timer_retry_did_not_close_transaction")
                  assert publish._sha256(unchanged) == baseline
                  assert systemctl("is-enabled", timer, check=False).stdout.strip() == "disabled"
                  print("Timer fired, retried after lock release, and closed the staged transaction.")
              finally:
                  for unit in (timer, service):
                      systemctl("stop", unit, check=False)
                      (publish.SYSTEMD_DIRECTORY / unit).unlink(missing_ok=True)
                  systemctl("daemon-reload")
          PY

  namespace-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install isolated runner prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            build-essential gnupg iproute2 iputils-ping libcap-dev libssl-dev nftables openssl pkg-config
          python -m pip install --disable-pip-version-check -e .
      - name: Build strongSwan 6.1.0
        run: |
          cd "$RUNNER_TEMP"
          for file in strongswan-6.1.0.tar.bz2 strongswan-6.1.0.tar.bz2.sig STRONGSWAN-RELEASE-PGP-KEY; do
            curl --fail --silent --show-error --location --retry 2 --max-time 180 \
              "https://download.strongswan.org/$file" -o "$file"
          done
          gpg --batch --dearmor --output "$RUNNER_TEMP/strongswan-release.gpg" STRONGSWAN-RELEASE-PGP-KEY
          gpgv --status-fd 1 --keyring "$RUNNER_TEMP/strongswan-release.gpg" \
            strongswan-6.1.0.tar.bz2.sig strongswan-6.1.0.tar.bz2 |
            grep -F '[GNUPG:] VALIDSIG 948F158A4E76A27BF3D07532DF42C170B34DBA77 '
          tar -xjf strongswan-6.1.0.tar.bz2
          cd strongswan-6.1.0
          prefix="$RUNNER_TEMP/strongswan"
          ./configure --prefix="$prefix" --with-piddir="$prefix/run" \
            --enable-eap-identity --enable-eap-mschapv2 --enable-md4 --enable-openssl --disable-gmp \
            > configure-output.log 2>&1 || { tail -120 configure-output.log; exit 1; }
          make -j"$(nproc)" > build-output.log 2>&1 || { tail -120 build-output.log; exit 1; }
          make install > install-output.log 2>&1 || { tail -120 install-output.log; exit 1; }
          test -x "$prefix/libexec/ipsec/charon"
      - name: Exercise full and split routing in network namespaces
        run: |
          evidence="$RUNNER_TEMP/ikev2-evidence"
          mkdir -m 700 "$evidence"
          python_bin="$(command -v python)"
          args=(--prefix "$RUNNER_TEMP/strongswan" --workdir "$evidence" --timeout 180)
          status=0
          sudo env "PYTHONPATH=$GITHUB_WORKSPACE" "$python_bin" tests/home_egress_namespace_acceptance.py "${args[@]}" || status=1
          sudo env "PYTHONPATH=$GITHUB_WORKSPACE" "$python_bin" tests/home_egress_namespace_acceptance.py "${args[@]}" --split-tunnel || status=1
          exit "$status"
      - name: Read isolated failure evidence
        if: failure()
        run: |
          evidence="$RUNNER_TEMP/ikev2-evidence"
          if [[ -d "$evidence" ]]; then
            sudo find "$evidence" -type f \( -name failure.txt -o -name last-command.stderr \
              -o -name projection-diagnostic.json -o -name daemon.log \) -print -exec tail -40 {} \;
          fi
